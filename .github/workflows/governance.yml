name: Governance Gate — Docs & Roadmap

# Closes audit finding #1: doc/roadmap governance was script-only (manual).
# This makes it an ENFORCED gate on every push/PR — NO continue-on-error.

on:
  push:
    branches: [ main, develop, "feat/**", "docs/**", "fix/**", "chore/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  governance:
    name: Doc + Roadmap Governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Docs validate (frontmatter · registry · templates · path refs)
        run: npm run docs:validate

      - name: Roadmap validate (Definition-of-Ready · Task Containers)
        run: npm run roadmap:validate

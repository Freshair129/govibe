name: E2E Tests — Mission Control App

# TASK-PRD-004 (GAP-02): this pipeline now boots the real application (Vite dev server + the
# sidecar, both via playwright.config.ts's webServer array) and exercises the roadmap board
# against live sidecar data, replacing the previous run against a static marketing fixture.
# The marketing-mockup spec (e2e/landing-page.spec.ts) still runs, but only in
# e2e-tests.yml against its own fixture-only config (playwright.landing.config.ts).

on:
  push:
    branches: [ main, develop, "feat/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  e2e-tests:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: ✅ Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📥 Install
        run: npm ci

      - name: 🔑 Bootstrap local .env
        # Never overwrites an existing .env (scripts/mcp/bootstrap-env.mjs) — safe here since a
        # CI runner never has one, and playwright.config.ts also calls this itself as a defense-
        # in-depth fallback, so this step documents the requirement rather than being the only
        # thing enforcing it.
        run: npm run env:bootstrap

      - name: 🎭 Install Playwright
        run: npx playwright install --with-deps chromium

      - name: 🧪 Run Tests
        run: npm run e2e -- --project=chromium

      - name: 📊 Generate Report
        if: always()
        run: test -f playwright-report/index.html && echo "Playwright report generated"

      - name: 📤 Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: 📋 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14

version: "1.0"
root_contract:
  global_context:
    - agent.md
    - GEMINI.md
    - AGENTS.md

executor_defaults:
  default: codex

executors:
  codex:
    transport: codex_exec
    allowed_modes:
      - doc
      - plan
      - audit
      - atomic
  ollama:
    transport: ollama_cli
    allowed_modes:
      - atomic
      - audit

local_sidecar:
  enabled: true
  allowed_modes:
    - atomic
    - audit
  model_tiers:
    tiny: llama3.2:1b    # 1b: stable up to 32k chars
    default: qwen3.5:4b  # 4b: stable up to 24k chars
    pro: gemma4:9b       # 9b: limit at 16,000 chars
    retry: gemma4:e2b    # 12b: limit at 12,000 chars
  tier_constraints:
    tiny: 32000
    default: 24000
    pro: 16000
    retry: 12000
  max_files: 8
  max_chars_per_file: 8000 # Global default safety fallback
  output_contract:
    sections:
      - Task Summary
      - Assumptions or Blockers
      - Files Inspected
      - Recommended Next Step

defaults:
  mode: doc
  max_files: 16
  max_chars_per_file: 12000
  include_extensions:
    - .md
    - .html
    - .txt
    - .yaml
    - .yml
    - .ps1
    - .mjs

modes:
  doc:
    include:
      - global_context
      - agent_contract
      - agent_default_context
      - scope_context

  plan:
    include:
      - global_context
      - agent_contract
      - agent_default_context
      - scope_context

  audit:
    include:
      - global_context
      - agent_contract
      - agent_default_context
      - scope_context
      - scope_verification_context

  atomic:
    include:
      - global_context
      - agent_contract
      - agent_default_context
      - scope_atomic_context

agents:
  theseus:
    label: THESEUS
    role: doc_writer
    contract: .agents/doc_writer/AGENT.md
    execution_policy:
      default_executor: codex
      allowed_executors:
        - codex
        - ollama
      default_mode: doc
      local_model_tier: default
    default_context:
      - docs/PRD-GoVibe-Platform-Overview.md
      - docs/architecture/C4-GoVibe-Platform.md
      - docs/SDD-System-Design.md
      - docs/STD-Execution-Governance.md
      - docs/features/README.md
    allowed_scopes:
      - docs/features/
      - docs/design/
      - docs/api/
      - docs/architecture/

  lyra:
    label: LYRA
    role: pm
    contract: .agents/pm/AGENT.md
    execution_policy:
      default_executor: codex
      allowed_executors:
        - codex
        - ollama
      default_mode: plan
      local_model_tier: default
    default_context:
      - docs/PRD-GoVibe-Platform-Overview.md
      - docs/architecture/C4-GoVibe-Platform.md
      - docs/SDD-System-Design.md
      - docs/STD-Execution-Governance.md
      - docs/features/README.md
      - docs/features/project-roadmap/FEAT-Document-Driven-Roadmap-Source.md
    allowed_scopes:
      - docs/roadmap/
      - docs/features/project-roadmap/
      - docs/features/

  ather:
    label: ATHER
    role: auditor
    contract: .agents/auditor/AGENT.md
    execution_policy:
      default_executor: codex
      allowed_executors:
        - codex
        - ollama
      default_mode: audit
      local_model_tier: tiny
    default_context:
      - docs/PRD-GoVibe-Platform-Overview.md
      - docs/architecture/C4-GoVibe-Platform.md
      - docs/SDD-System-Design.md
      - docs/STD-Execution-Governance.md
      - docs/features/README.md
    allowed_scopes:
      - docs/
      - src/
      - public/
      - comp/

  janus:
    label: JANUS
    role: devops
    contract: .agents/devops/AGENT.md
    execution_policy:
      default_executor: codex
      allowed_executors:
        - codex
        - ollama
      default_mode: atomic
      local_model_tier: retry
    default_context:
      - docs/rca/
      - scripts/
      - package.json
    allowed_scopes:
      - scripts/
      - .agents/devops/
      - .vercel/
      - workflows/

  rkoi:
    label: RKOI
    role: tech_lead
    contract: .agents/tech_lead/AGENT.md
    execution_policy:
      default_executor: codex
      allowed_executors:
        - codex
      default_mode: audit
      local_model_tier: default
    default_context:
      - src/
      - docs/
    allowed_scopes:
      - src/
      - docs/

  theseus:
  docs/features/agent-team:
    preferred_agent: theseus
    execution_policy:
      preferred_executor: codex
      allowed_executors:
        - codex
        - ollama
      local_mode_policy: atomic_only
